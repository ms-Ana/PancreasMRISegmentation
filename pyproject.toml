[project]
name = "PancreasMRISegmentation"
version = "0.1.0"
description = "Comprehensive analysis of state-of-the-art deep learning solutions for pancreas MRI segmentation, including architectures, datasets, evaluation metrics, and current limitations."
authors = [
    {name = "ms-Ana", email = "ms.urmanana@gmail.com"},
]
dependencies = ["nnunet>=1.7.1", 
"nnunetv2>=2.6.2", 
"torch==2.10.0", 
"click>=8.3.1", 
"gdown>=5.2.1", 
"monai>=1.5.2", 
"omegaconf>=2.3.0", 
"python-dotenv>=1.2.2", 
]

requires-python = "<3.15,>=3.12"
readme = "README.md"
license = {text = "MIT"}


[project.optional-dependencies]
umamba = ["causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.1.post4/causal_conv1d-1.6.1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", 
"mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.3.1/mamba_ssm-2.3.1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl"]
all = [
    "pancreasmrisegmentation[umamba]"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = true

[project.scripts]
custom_nnUNetv2_predict_from_modelfolder = "pancreasmrisegmentation.run.predict_from_raw_data:predict_entry_point_modelfolder"
umamba_nnUNetv2_predict_from_modelfolder = "pancreasmrisegmentation.umamba.inference.predict_from_raw_data:predict_entry_point_modelfolder"